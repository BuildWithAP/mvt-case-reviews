<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Patients · Aster MVT</title>
<link rel="stylesheet" href="assets/gate.css?v=69acbd07">
</head>
<body>
<main class="gate">
  <div class="card">
    <div class="marks">
      <img src="assets/aster-logo.png" alt="Aster">
    </div>

    <h1>MVT patients</h1>
    <p class="for">Aster Medical Value Travel · team access</p>

    <form id="gate-form" autocomplete="off">
      <label for="gate-pass">Team passphrase</label>
      <input id="gate-pass" type="password" inputmode="text" autocomplete="current-password"
             placeholder="Enter the team passphrase" spellcheck="false" autocapitalize="none" autocorrect="off">
      <button type="submit">Open patient list</button>
    </form>

    <p id="gate-err" class="err" role="alert"></p>
  </div>

  <p class="foot">Confidential patient information. The list is encrypted and your passphrase stays on this device. Case pages have their own passphrases.</p>
</main>

<script src="content.enc.js?v=69acbd07"></script>
<script src="assets/gate.js?v=69acbd07"></script>
</body>
</html>
