<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Case review · Aster MVT</title>
<link rel="stylesheet" href="../assets/gate.css?v=b3d26f2a">
</head>
<body>
<main class="gate">
  <div class="card">
    <div class="marks">
      <img src="../assets/aster-logo.png" alt="Aster">
    </div>

    <h1>Case review</h1>
    <p class="for">Aster Medical Value Travel · MVT-ENQ-062</p>

    <form id="gate-form" autocomplete="off">
      <label for="gate-pass">Passphrase</label>
      <input id="gate-pass" type="password" inputmode="text" autocomplete="current-password"
             placeholder="Enter your passphrase" spellcheck="false">
      <button type="submit">Open case</button>
    </form>

    <p id="gate-err" class="err" role="alert"></p>
  </div>

  <p class="foot">Confidential patient information. The case is encrypted and your passphrase stays on this device.</p>
</main>

<script src="content.enc.js?v=b3d26f2a"></script>
<script src="../assets/gate.js?v=b3d26f2a"></script>
</body>
</html>
